x-base-config: &base-config
  build:
    context: .
    dockerfile: ./docker/Dockerfile
    args:
      BUNDLE_WITHOUT: ''
      EXECJS_RUNTIME: 'Node'
      RAILS_ENV: 'development'
      RAILS_SERVE_STATIC_FILES: 'true'
  volumes:
    - ./:/app:delegated
    - chatwoot-storage:/app/storage
    - node_modules:/app/node_modules
    - packs:/app/public/packs
    - cache:/app/tmp/cache
    - bundle:/usr/local/bundle
  networks:
    - dokploy-network
  environment:
    - FRONTEND_URL=${FRONTEND_URL}
    - SECRET_KEY_BASE=${SECRET_KEY_BASE}
    - RAILS_ENV=${RAILS_ENV}
    - NODE_ENV=${NODE_ENV}
    - INSTALLATION_ENV=${INSTALLATION_ENV}
    - RAILS_LOG_TO_STDOUT=${RAILS_LOG_TO_STDOUT}
    - LOG_LEVEL=${LOG_LEVEL}
    - DEFAULT_LOCALE=${DEFAULT_LOCALE}
    - POSTGRES_HOST=${POSTGRES_HOST}
    - POSTGRES_PORT=${POSTGRES_PORT}
    - POSTGRES_DATABASE=${POSTGRES_DATABASE}
    - POSTGRES_USERNAME=${POSTGRES_USERNAME}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - REDIS_URL=${REDIS_URL}
    - ENABLE_ACCOUNT_SIGNUP=${ENABLE_ACCOUNT_SIGNUP}
    - ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE}

services:
  chatwoot-rails:
    <<: *base-config
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'sh', '-c', 'rails db:chatwoot_prepare && rails s -p 3000 -b 0.0.0.0']
    restart: always

  chatwoot-sidekiq:
    <<: *base-config
    depends_on:
      chatwoot-rails:
        condition: service_started
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

networks:
  dokploy-network:
    external: true

volumes:
  chatwoot-storage:
  node_modules:
  packs:
  cache:
  bundle:
